<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply a validated preference before CSS paints, including on owner pages.
      try {
        const theme = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme = [
          "dark",
          "light",
          "blue",
          "green",
        ].includes(theme)
          ? theme
          : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Muhammad Aashir Sheraz | CS Student & Developer</title>
    <meta
      name="description"
      content="Portfolio of Muhammad Aashir Sheraz — CS student at FAST-NUCES, passionate about full-stack development and software engineering."
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Muhammad Aashir Sheraz | CS Student & Developer"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Portfolio of Muhammad Aashir Sheraz — CS student at FAST-NUCES, passionate about full-stack development and software engineering."
    />

    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
